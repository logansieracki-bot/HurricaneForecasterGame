name: Build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install headless Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the Atlantic simulator
        run: npm run build

      - name: Run end-to-end checks
        run: npm test

      - name: Upload built simulator
        if: success()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: atlantic-sst-simulator
          path: dist/atlantic-sst-simulator.html
          if-no-files-found: error

      - name: Link the built HTML in the run summary
        if: success()
        run: |
          echo "### Built simulator" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from **this run's Summary page → Artifacts (bottom of the page) → \`atlantic-sst-simulator\`**, unzip, and open the \`.html\` file in a browser." >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.upload.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
