name: Build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install headless Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the simulators
        run: npm run build

      - name: Run end-to-end checks
        run: npm test

      - name: Upload built simulators
        if: success()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: sst-simulators
          path: |
            dist/atlantic-sst-simulator.html
            dist/eastpacific-sst-simulator.html
          if-no-files-found: error

      - name: Link the built HTML in the run summary
        if: success()
        run: |
          echo "### Built simulators" >> "$GITHUB_STEP_SUMMARY"
          echo "Download them from **this run's Summary page → Artifacts (bottom of the page) → \`sst-simulators\`**, unzip, and open either \`.html\` file in a browser." >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.upload.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

  # Publishes the main menu + built simulator to GitHub Pages. Only runs once
  # tests pass, and only for real pushes to main (not PRs). Requires
  # Settings -> Pages -> Source: "GitHub Actions" to be set once, by hand.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site/dist
          cp index.html _site/
          cp dist/atlantic-sst-simulator.html _site/dist/
          cp dist/eastpacific-sst-simulator.html _site/dist/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
