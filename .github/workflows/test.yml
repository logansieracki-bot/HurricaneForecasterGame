name: Build & test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install headless Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build the Atlantic simulator
        run: npm run build

      - name: Run end-to-end checks
        run: npm test

      - name: Upload built simulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlantic-sst-simulator
          path: dist/atlantic-sst-simulator.html
          if-no-files-found: ignore
