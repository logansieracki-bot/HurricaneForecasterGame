<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#060a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23060a12%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%2372d6ff%27 stroke-width=%272%27 opacity=%27.55%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27none%27 stroke=%27%2372d6ff%27 stroke-width=%272%27/%3E%3Cpath d=%27M16 16L24 8%27 stroke=%27%2372d6ff%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<title>Isobar Severe · Radar</title>
<style>/*__SEVERE_CSS__*/</style>
</head>
<body>
<div id="app">
  <div id="panes"></div>

  <header id="top">
    <a id="back" href="../index.html#disc" aria-label="Back to the menu"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Menu</span></a>
    <div id="brand"><b>Isobar</b> Severe <i>Radar</i></div>
    <div id="mode" class="seg" role="tablist" aria-label="Draw a day or watch the radar"><button id="m-draw" role="tab" aria-selected="false">Draw</button><button id="m-radar" role="tab" aria-selected="true">Radar</button></div>
    <span class="grow"></span>
    <div class="tools top-tools">
      <button id="b-storms" class="ib" title="Storms" aria-label="Storms" aria-haspopup="true"><svg viewBox="0 0 24 24"><path d="M7.500 16.500a4 4 0 0 1-.6-7.900A5.500 5.500 0 0 1 17.400 7.600a3.700 3.700 0 0 1-.4 7.400"/><path d="M12.500 11.500l-2.500 4.500h3.500l-1.500 4.500"/></svg></button>
      <button id="b-panes" class="ib" title="One or two panes" aria-label="One or two panes"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="7.5" height="14" rx="2"/><rect x="13" y="5" width="7.5" height="14" rx="2"/></svg></button>
      <button id="b-layers" class="ib" title="Map layers" aria-label="Map layers"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
      <button id="b-theme" class="ib" title="Dark or light" aria-label="Dark or light"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg></button>
      <button id="b-settings" class="ib" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.4"/><circle cx="9" cy="17" r="2.4"/></svg></button>
    </div>
  </header>

  <div id="dock" role="toolbar" aria-label="Radar controls">
    <div id="stamp">HYPOTHETICAL · Isobar Severe Simulator</div>
    <div class="dk-row">
      <button id="site" class="badge" aria-haspopup="true" title="Choose a radar">
        <span class="badge-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 12L18.5 5.5"/><circle cx="12" cy="12" r="6.5" opacity=".55"/><circle cx="12" cy="12" r="10" opacity=".3"/></svg></span>
        <span class="badge-t"><b id="site-id">KVNX</b><i id="site-nm">Enid, OK</i></span>
      </button>
      <span class="sep"></span>
      <button id="prod" class="sel" aria-haspopup="true" title="Product"><b id="prod-nm">Base Reflectivity</b><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="tilt" title="Tilt (elevation angle)"><button id="tilt-dn" aria-label="Lower tilt">−</button><span id="tilt-v">0.5°</span><button id="tilt-up" aria-label="Higher tilt">+</button></div>
      <span class="sep"></span>
      <div class="transport">
        <button id="t-first" class="ib" title="First frame" aria-label="First frame"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg></button>
        <button id="t-prev" class="ib" title="Previous frame" aria-label="Previous frame"><svg viewBox="0 0 24 24"><path d="M18 5l-9 7 9 7z"/></svg></button>
        <button id="t-play" class="ib play" title="Play or pause" aria-label="Play"><svg id="ic-play" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z"/></svg><svg id="ic-pause" viewBox="0 0 24 24" hidden><path d="M7 5v14M17 5v14"/></svg></button>
        <button id="t-next" class="ib" title="Next frame" aria-label="Next frame"><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z"/></svg></button>
        <button id="t-last" class="ib" title="Last frame" aria-label="Last frame"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></svg></button>
      </div>
      <span class="sep"></span>
      <div class="chips" id="int" title="Minutes between frames"><button data-i="1">1</button><button data-i="3">3</button><button data-i="5">5</button><button data-i="10">10</button><i>min</i></div>
      <button id="speed" class="chip" title="Playback speed, in game minutes per second">×5</button>
      <span class="grow"></span>
      <div class="tools">
        <button id="b-measure" class="ib" title="Measure (M)" aria-label="Measure"><svg viewBox="0 0 24 24"><path d="M3.5 16.5l13-13 4 4-13 13z"/><path d="M8 8l2 2M11 5l2 2M5 11l2 2"/></svg></button>
        <button id="b-probe" class="ib" title="Probe (P)" aria-label="Probe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button>
        <button id="b-locate" class="ib" title="Centre on the radar (C)" aria-label="Centre on the radar"><svg viewBox="0 0 24 24"><path d="M12 3l7.5 17L12 16.5 4.5 20z"/></svg></button>
      </div>
      <div class="clock"><b id="clk">3:00 PM</b><i id="clk-sub">Updated 3:00 PM</i></div>
    </div>
    <div class="dk-slider"><input id="slider" type="range" min="0" max="1000" value="0" step="1" aria-label="Frame"><div id="ticks" aria-hidden="true"></div></div>
  </div>

  <div id="zoom" role="group" aria-label="Zoom"><button id="z-in" class="ib" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="z-out" class="ib" title="Zoom out (-)" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button></div>
  <section id="editor" hidden aria-label="Draw a day">
    <div id="ed-pane"><canvas class="cv-base"></canvas><canvas class="cv-fill"></canvas><canvas class="cv-top"></canvas></div>
    <div id="ed-tools" role="toolbar" aria-label="Drawing tools" aria-orientation="vertical"></div>
    <div id="ed-hint" hidden></div>
    <div id="ed-warn"></div>
    <aside id="ed-side">
      <div id="ed-day" class="glass"></div>
      <div id="ed-props" class="glass" hidden></div>
    </aside>
    <div id="ed-legend" hidden><canvas width="520" height="46"></canvas></div>
    <div id="ed-sheet" class="glass" hidden></div>
    <div id="ed-run" class="glass" hidden role="dialog" aria-label="Run a storm"></div>
    <div id="ed-dock" role="toolbar" aria-label="Day controls">
      <div id="ed-stamp" class="stamp">HYPOTHETICAL · Isobar Severe Simulator</div>
      <div class="dk-row">
        <button id="ed-undo" class="ib" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7L4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H11" transform="translate(0 -4)"/></svg></button>
        <button id="ed-redo" class="ib" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 7l4.500 4.500L15 16"/><path d="M19 11.500H9.500a5 5 0 0 0 0 10H13" transform="translate(0 -4)"/></svg></button>
        <span class="sep"></span>
        <button id="ed-play" class="ib play" title="Play the day (Space)" aria-label="Play"><svg id="ed-ic-play" viewBox="0 0 24 24"><path d="M7 4.500l13 7.500-13 7.500z"/></svg><svg id="ed-ic-pause" viewBox="0 0 24 24" hidden><path d="M7 5v14M17 5v14"/></svg></button>
        <div class="clock"><b id="ed-clk">+0 h</b><i id="ed-clk-sub">12:00 PM</i></div>
        <span class="grow"></span>
        <button id="ed-start" class="primary" title="Run a storm at the spot you tapped">Run a storm</button>
      </div>
      <div class="dk-slider"><input id="ed-slider" class="rng" type="range" min="0" max="12" step="0.25" value="0" aria-label="Hours after the drawing"><div id="ed-ticks" aria-hidden="true"></div></div>
    </div>
  </section>
  <div id="pop" hidden></div>
  <div id="toast" hidden></div>
</div>
<!--__SEVERE_SCRIPTS__-->
</body>
</html>
