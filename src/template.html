<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlantic sea surface temperature simulator</title>
<style>/*__LEAFLET_CSS__*/</style>
<style>
:root{
  --ink:#121212; --panel:#1a1a1c; --line:rgba(255,255,255,.12);
  --text:#e8e8e8; --dim:#999999; --ice:#efefef; --focus:#bdbdbd; --season:rgba(255,166,96,.14);
  --font:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--font)}
#map{position:absolute;inset:0;background:#10161c;outline:none}
.leaflet-container{background:#10161c;font-family:var(--font)}
.card{position:absolute;z-index:900;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.5)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* clock */
#clock{left:14px;top:14px;padding:12px 16px 12px;min-width:236px}
#c-date{font-size:15px;font-weight:500;color:var(--dim)}
#c-time{font-size:46px;font-weight:600;letter-spacing:-.025em;line-height:1.02;font-variant-numeric:tabular-nums}
#c-time small{font-size:14px;font-weight:500;color:var(--dim);letter-spacing:.02em;margin-left:7px}
#c-meta{font-size:12px;color:var(--dim);margin-top:3px}
#year{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:11px}
#year span{font-size:10px;text-align:center;color:var(--dim);padding:3px 0;border-radius:3px}
#year span.hs{background:var(--season)}
#year span.now{background:var(--ice);color:#141414;font-weight:700}
#year-bar{height:2px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:5px;overflow:hidden}
#year-bar i{display:block;height:100%;width:0;background:var(--ice)}

#enso{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:11.5px;color:var(--dim)}
#gauge{position:relative;flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px}
#gauge:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.4)}
#gauge-fill{position:absolute;top:0;bottom:0;border-radius:3px;left:50%;width:0}
#enso b{min-width:36px;text-align:right;color:var(--text);font-size:12px;font-variant-numeric:tabular-nums}
#enso-l{font-size:11.5px;color:var(--dim);margin-top:3px}

/* transport dock */
#dock{left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:4px;padding:8px 12px 8px 8px}
.btn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.09)}
.btn svg{width:20px;height:20px;fill:currentColor}
#b-play{width:50px;height:50px;border-radius:50%;background:var(--ice);color:#141414;margin:0 4px}
#b-play:hover{background:#fff}
#b-play svg{width:22px;height:22px}
#speed{min-width:132px;padding-left:8px;line-height:1.15}
#speed b{display:block;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
#speed span{font-size:11.5px;color:var(--dim)}

/* side panel */
#panel{right:14px;top:14px;width:296px;max-height:calc(100% - 188px);overflow:auto;padding:12px 16px 14px}
#panel header{display:flex;align-items:center;justify-content:space-between}
#panel h2{font-size:14px;font-weight:600;margin:0}
.subhead{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;font:inherit;font-size:13px;font-weight:600;color:var(--text);margin:18px 0 2px;padding:14px 0 2px;cursor:pointer}
.subsec:first-child .subhead{margin-top:0;padding-top:0;border-top:0}
.subhead .chev{font-style:normal;color:var(--dim);font-size:11px;transition:transform .15s ease}
.subsec.collapsed .subhead .chev{transform:rotate(-90deg)}
.subsec.collapsed .subbody{display:none}
#panel p.hint:empty{display:none}
#panel p.hint{font-size:11.5px;color:var(--dim);margin:0 0 6px;line-height:1.4}
#collapse{width:28px;height:28px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--dim)}
#collapse:hover{background:rgba(255,255,255,.09);color:var(--text)}
#panel.collapsed .body{display:none}
#panel.collapsed{width:auto}
.row{margin:12px 0 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(255,255,255,.07);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 4px;font-size:12.5px;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--ice);color:#141414;font-weight:600}
.sl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:2px}
.sl output{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
input[type=range]{width:100%;margin:2px 0 0;accent-color:#d4d4d4;height:20px}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:9px;cursor:pointer}
.chk input{accent-color:#d4d4d4;width:15px;height:15px;margin:0}
.seedrow{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:12.5px}
.seedrow input[type=number]{width:96px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:5px 8px;font:inherit;font-variant-numeric:tabular-nums}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.pill:hover{background:rgba(255,255,255,.13)}

/* readout + legend */
#readout{left:14px;bottom:16px;padding:8px 14px;min-width:232px}
#readout b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
#readout div{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:1px}
#legend{right:14px;bottom:34px;width:292px;padding:10px 14px 9px}
#legend canvas{display:block;width:100%;height:11px;border-radius:3px}
#ticks{position:relative;height:16px;margin-top:3px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
#ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#ticks span.key{color:var(--text);font-weight:600}
#legend-cap{font-size:11.5px;color:var(--dim);margin-top:2px}

.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:4px}
.themes button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:9px;padding:6px 4px 5px;text-align:center;font-size:11.5px;cursor:pointer;color:var(--dim);transition:background .12s ease,border-color .12s ease,color .12s ease}
.themes button i{display:block;height:20px;border-radius:5px;margin:0 auto 4px;border:1px solid rgba(255,255,255,.22)}
.themes button:hover{background:rgba(255,255,255,.11);color:var(--text)}
.themes button[aria-pressed=true]{border-color:var(--ice);background:rgba(255,255,255,.15);color:var(--text);font-weight:600}
#attr{position:absolute;right:0;bottom:0;z-index:900;font-size:10.5px;color:var(--dim);background:#1a1a1c;padding:2px 8px;border-top-left-radius:6px;pointer-events:none}

/* notices + loader */
#toast{left:50%;top:16px;transform:translateX(-50%);padding:9px 16px;font-size:13px;display:none}
#city-tip{padding:9px 12px;max-width:210px;pointer-events:none;display:none;z-index:950}
#city-tip b{font-size:13px;font-weight:600;display:block}
#city-tip div{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.5}
#loading{position:absolute;inset:0;z-index:2000;display:grid;place-items:center;background:var(--ink);font-size:14px;color:var(--dim)}

/* leaflet chrome */
.leaflet-bottom.leaflet-left{margin-bottom:70px}
.leaflet-control-zoom{border:1px solid var(--line)!important;border-radius:10px!important;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-bottom:1px solid var(--line)!important}
.leaflet-control-zoom a:hover{background:rgba(255,255,255,.12)!important}
.leaflet-control-attribution{background:#1a1a1c!important;color:var(--dim)!important;font-size:10.5px}
.leaflet-control-attribution a{color:#bdbdbd!important}
canvas.overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

@media (max-width:1040px){
  #readout{bottom:84px}
  #legend{bottom:112px}
  #panel{max-height:calc(100% - 300px)}
}
@media (max-width:640px){
  #clock{min-width:0;padding:9px 12px}
  #c-time{font-size:34px}
  #panel{width:calc(100% - 28px);top:auto;bottom:196px;max-height:38%}
  #legend{width:calc(100% - 28px);bottom:112px;right:14px}
  #readout{display:none}
  .leaflet-control-zoom{display:none}
  #dock{width:calc(100% - 28px);justify-content:space-between}
  #speed{min-width:0}
  #speed span{display:none}
}
</style>
</head>
<body>
<div id="map" tabindex="-1"></div>

<section id="clock" class="card" aria-label="Simulation clock">
  <div id="c-date">Jun 1, 2026</div>
  <div id="c-time">00:00<small>UTC</small></div>
  <div id="c-meta">Day 1</div>
  <div id="year" title="Months of the year. Shaded: Atlantic hurricane season (Jun–Nov)"></div>
  <div id="year-bar"><i></i></div>
  <div id="enso" title="Niño 3.4 sea surface temperature anomaly: the El Niño / La Niña index">
    <span>Niño 3.4</span><div id="gauge"><i id="gauge-fill"></i></div><b id="enso-v">+0.0</b>
  </div>
  <div id="enso-l">Neutral</div>
</section>

<aside id="panel" class="card" aria-label="Layers and experiments">
  <header><h2>Ocean layers</h2><button id="collapse" aria-label="Collapse panel" title="Collapse panel">&#9662;</button></header>
  <div class="body">
    <section class="subsec" id="sec-custom">
      <button class="subhead" aria-expanded="true" aria-controls="sec-custom-b"><span>Customization</span><i class="chev">&#9662;</i></button>
      <div class="subbody" id="sec-custom-b">
        <div class="row seg" id="seg-view" role="group" aria-label="Map layer">
          <button data-v="sst" aria-pressed="true">Temperature</button>
          <button data-v="anom" aria-pressed="false">SST Anomaly</button>
        </div>
        <div class="row">
          <div class="sl"><label for="op">Overlay strength</label><output id="op-o">85%</output></div>
          <input id="op" type="range" min="0" max="100" value="85">
        </div>
        <div class="row">
          <div class="sl"><span>Map theme</span></div>
          <div id="themes" class="themes" role="group" aria-label="Map theme"></div>
          <p class="hint" id="th-note"></p>
        </div>
        <label class="chk" id="detail-row"><input type="checkbox" id="detail" checked> Sharper imagery when zoomed in</label>
        <label class="chk"><input type="checkbox" id="show-sst" checked> Show sea temperature</label>
        <label class="chk"><input type="checkbox" id="borders" checked> State and country lines</label>
        <label class="chk"><input type="checkbox" id="cities" checked> City markers</label>
        <div class="row">
          <div class="sl"><span>Coordinates</span></div>
          <div class="seg" id="seg-grid" role="group" aria-label="Coordinate grid">
            <button data-g="off" aria-pressed="true">Off</button><button data-g="grid" aria-pressed="false">Grid</button><button data-g="labels" aria-pressed="false">Labels</button>
          </div>
        </div>
        <label class="chk"><input type="checkbox" id="l265" checked> 26.5 °C line (hurricane threshold)</label>
        <label class="chk"><input type="checkbox" id="l2"> Isotherms every 2 °C</label>
      </div>
    </section>
    <section class="subsec collapsed" id="sec-exp">
      <button class="subhead" aria-expanded="false" aria-controls="sec-exp-b"><span>Experimentation</span><i class="chev">&#9662;</i></button>
      <div class="subbody" id="sec-exp-b">
        <p class="hint">Normal = 1991–2020 average.</p>
        <div class="row">
          <div class="sl"><label for="p-warm">Warming</label><output id="p-warm-o">+0.0 °C</output></div>
          <input id="p-warm" type="range" min="-3" max="4" step="0.1" value="0">
        </div>
        <div class="row">
          <div class="sl"><label for="p-var">Year-to-year variability</label><output id="p-var-o">1.0×</output></div>
          <input id="p-var" type="range" min="0" max="3" step="0.1" value="1">
        </div>
        <div class="row">
          <div class="sl"><label for="p-sea">Seasonal swing</label><output id="p-sea-o">1.0×</output></div>
          <input id="p-sea" type="range" min="0" max="2" step="0.05" value="1">
        </div>
        <div class="row">
          <div class="sl"><label for="p-feat">Currents and upwelling</label><output id="p-feat-o">1.0×</output></div>
          <input id="p-feat" type="range" min="0" max="2" step="0.05" value="1">
        </div>
        <div class="row">
          <div class="sl"><label for="p-enso">El Niño / La Niña influence</label><output id="p-enso-o">1.0×</output></div>
          <input id="p-enso" type="range" min="0" max="4" step="0.05" value="1">
        </div>
        <div class="row">
          <div class="sl"><label for="p-ensonow">Set ENSO now</label><output id="p-ensonow-o">Neutral</output></div>
          <input id="p-ensonow" type="range" min="-3" max="3.4" step="0.1" value="0">
        </div>
        <div class="seedrow">
          <label for="seed">Seed</label><input id="seed" type="number" min="1" max="999999" step="1">
          <button class="pill" id="b-newseed" title="Pick a new random year and restart">New seed</button>
          <button class="pill" id="b-reset" title="Reset the sliders (seed-nudged ones go back to this seed's values)">Reset</button>
        </div>
        <label class="chk"><input type="checkbox" id="seed-vary" checked> Seed nudges swing, currents and El Niño</label>
      </div>
    </section>
  </div>
</aside>

<div id="readout" class="card" aria-live="off"><b>–</b><div>Move the pointer over the ocean</div></div>

<div id="legend" class="card">
  <canvas id="legend-canvas" width="264" height="11"></canvas>
  <div id="ticks"></div>
  <div id="legend-cap">Sea surface temperature, °C</div>
</div>

<div id="toast" class="card" role="status"></div>
<div id="city-tip" class="card" role="tooltip"><b></b><div></div></div>
<div id="attr"></div>

<nav id="dock" class="card" aria-label="Playback">
  <button class="btn" id="b-restart" aria-label="Restart at June 1" title="Restart at June 1 (R)">
    <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
  </button>
  <button class="btn" id="b-slower" aria-label="Slower" title="Slower ( [ )">
    <svg viewBox="0 0 24 24"><path d="M11 6v12l-8.5-6zM21 6v12l-8.5-6z"/></svg>
  </button>
  <button class="btn" id="b-play" aria-label="Pause" title="Pause / play (Space)">
    <svg viewBox="0 0 24 24" id="ic-pause"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    <svg viewBox="0 0 24 24" id="ic-play" style="display:none"><path d="M7 4v16l13-8z"/></svg>
  </button>
  <button class="btn" id="b-faster" aria-label="Faster" title="Faster ( ] )">
    <svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6zM3 6v12l8.5-6z"/></svg>
  </button>
  <div id="speed"><b id="speed-x">1×</b><span id="speed-sub">+1 h every 60 ms</span></div>
</nav>

<div id="loading">Building the ocean grid…</div>

<script type="application/json" id="sim-data">/*__DATA__*/</script>
<script>/*__LEAFLET_JS__*/</script>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const DATA = JSON.parse($('sim-data').textContent);

/* ------------------------------------------------------------------ *
 *  Grid + decoding
 * ------------------------------------------------------------------ */
const DM = DATA.domain;
const NX = DM.nx, NY = DM.ny, RES = DM.res, LON0 = DM.lon0, LAT1 = DM.lat1;
const CNX = DM.cnx, CNY = DM.cny, RATIO = DM.cres / DM.res;
const N = NX * NY, CN = CNX * CNY, K = DATA.K;
const DEG = Math.PI / 180;

function b64bytes(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function b64i16(s) { const u = b64bytes(s); return new Int16Array(u.buffer, 0, u.length >> 1); }

const land = new Uint8Array(N);                 // 1 = land (0.25° nodes)
{ const mb = b64bytes(DATA.mask); for (let k = 0; k < N; k++) land[k] = (mb[k >> 3] >> (7 - (k & 7))) & 1; }

/* Cells that belong to a different basin, not this Atlantic build: south of the equator
   (the South Atlantic, its own future basin) and the Mediterranean/Black Sea (ditto). SST is
   left NaN there ("outside the simulated area"), same as cells outside the grid entirely. */
const outOfBasin = new Uint8Array(N);
{
  // The Mediterranean's western edge isn't a straight meridian -- it follows the Spain/France
  // coastline northeast from Gibraltar. A flat lon >= -6 cutoff was clipping real open Atlantic
  // (Bay of Biscay, off Brittany/the Basque coast) as if it were Mediterranean. Interpolate the
  // cutoff longitude by latitude instead, roughly tracing that coast; north of the last point
  // there's no more Mediterranean on the west side at all (France separates the two seas), so
  // the cutoff longitude goes past MED_LON1 and excludes nothing.
  const MED_LON1 = 40, MED_LAT0 = 30, MED_LAT1 = 47, SOUTH_EDGE = -8;   // a few degrees south of the equator: clears the southern Main Development Region with room to spare, short of the South Atlantic
  const MED_W_LAT = [30, 36, 37.5, 39.5, 41, 42.5, 43.5];
  const MED_W_LON = [-6, -5.5, -1, 0.5, 2, 3, 90];
  for (let j = 0; j < NY; j++) {
    const lat = LAT1 - j * RES, o = j * NX;
    if (lat >= SOUTH_EDGE && (lat > MED_LAT1 || lat < MED_LAT0)) continue;
    const medLon0 = lat >= MED_LAT0 && lat <= MED_LAT1 ? interp1(MED_W_LAT, MED_W_LON, lat) : null;
    for (let i = 0; i < NX; i++) {
      if (lat < SOUTH_EDGE) { outOfBasin[o + i] = 1; continue; }
      if (medLon0 === null) continue;
      const lon = LON0 + i * RES;
      if (lon >= medLon0 && lon <= MED_LON1) outOfBasin[o + i] = 1;
    }
  }
}

const climC = [];                               // 12 coarse monthly climatologies (°C)
{ const a = b64i16(DATA.clim); for (let m = 0; m < 12; m++) { const f = new Float32Array(CN); for (let c = 0; c < CN; c++) f[c] = a[m * CN + c] / 100; climC.push(f); } }
const eofC = new Float32Array(K * CN);          // interannual patterns (°C per +1σ of each mode)
{ const a = b64i16(DATA.eof); for (let q = 0; q < a.length; q++) eofC[q] = a[q] / 1000; }
const ensoC = new Float32Array(3 * CN);          // Atlantic response to Niño 3.4 at lags 0, 3, 6 months (°C per °C)
{ const a = b64i16(DATA.enso); for (let q = 0; q < a.length; q++) ensoC[q] = a[q] / 1000; }
const PHI_DAY = DATA.phi.map((p) => Math.pow(Math.max(0.3, p), 1 / 30.44));

/* Catmull-Rom weights */
function cr(t) { const t2 = t * t, t3 = t2 * t; return [-0.5 * t3 + t2 - 0.5 * t, 1.5 * t3 - 2.5 * t2 + 1, -1.5 * t3 + 2 * t2 + 0.5 * t, 0.5 * t3 - 0.5 * t2]; }

/* Separable bicubic upsampler: coarse (2°) -> fine (0.25°) */
const upsample = (function () {
  const cI = new Int32Array(NX * 4), cW = new Float32Array(NX * 4);
  for (let i = 0; i < NX; i++) { const f = i / RATIO, c1 = Math.floor(f), w = cr(f - c1); for (let q = 0; q < 4; q++) { cI[i * 4 + q] = Math.min(CNX - 1, Math.max(0, c1 - 1 + q)); cW[i * 4 + q] = w[q]; } }
  const rI = new Int32Array(NY * 4), rW = new Float32Array(NY * 4);
  for (let j = 0; j < NY; j++) { const f = j / RATIO, r1 = Math.floor(f), w = cr(f - r1); for (let q = 0; q < 4; q++) { rI[j * 4 + q] = Math.min(CNY - 1, Math.max(0, r1 - 1 + q)); rW[j * 4 + q] = w[q]; } }
  const tmp = new Float32Array(CNY * NX);
  return function (src, dst) {
    for (let r = 0; r < CNY; r++) {
      const ro = r * CNX, to = r * NX;
      for (let i = 0; i < NX; i++) {
        const b = i * 4, s0 = src[ro + cI[b]], s1 = src[ro + cI[b + 1]], s2 = src[ro + cI[b + 2]], s3 = src[ro + cI[b + 3]];
        let v = s0 * cW[b] + s1 * cW[b + 1] + s2 * cW[b + 2] + s3 * cW[b + 3];
        // Clamp to the local min/max: Catmull-Rom can overshoot past its own input range near a
        // sharp jump in the coarse (2 deg) data -- e.g. a strait/inlet much narrower than 2 deg.
        // Unclamped, that shows up as a visible band of over/undershoot in the upsampled field;
        // clamping is a no-op everywhere the curve doesn't overshoot, i.e. almost everywhere else.
        const lo = Math.min(s0, s1, s2, s3), hi = Math.max(s0, s1, s2, s3);
        tmp[to + i] = v < lo ? lo : v > hi ? hi : v;
      }

  drawLakes(ctx, minX, minY, ws);
  sstCanvas.style.opacity = $('op').value / 100;
  }
  drawBaseLayer(minX, minY, ws);
  drawGrid(minX, minY, ws);
  updateReadout();
}
let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
map.on('move zoom resize', scheduleRender);
map.on('movestart zoomstart', () => { interacting = true; });
map.on('moveend zoomend', () => { interacting = false; scheduleRender(); });
window.addEventListener('resize', () => { map.invalidateSize(); scheduleRender(); });

/* ------------------------------------------------------------------ *
 *  Readout + legend
 * ------------------------------------------------------------------ */
let pointer = null;
map.on('mousemove', (e) => { pointer = e.latlng; updateReadout(); updateCityTip(e.containerPoint.x, e.containerPoint.y); });
map.on('mouseout', () => { pointer = null; updateReadout(); hoveredCity = -1; $('city-tip').style.display = 'none'; });
$('cities').onchange = () => { hoveredCity = -1; $('city-tip').style.display = 'none'; scheduleRender(); };
const fmtLL = (lat, lon) => Math.abs(lat).toFixed(1) + '°' + (lat >= 0 ? 'N' : 'S') + ' ' + Math.abs(lon).toFixed(1) + '°' + (lon >= 0 ? 'E' : 'W');
function updateReadout() {
  const el = $('readout');
  if (!pointer) { el.innerHTML = '<b>–</b><div>Move the pointer over the ocean</div>'; return; }
  const lat = pointer.lat, lon = ((pointer.lng + 540) % 360) - 180;
  const li = lakeAt(lat, lon);
  if (li >= 0) { const dv = lakeV[li] - lakeN[li]; el.innerHTML = '<b>' + lakeV[li].toFixed(1) + ' °C</b><div>' + (LAKE_META[li].name || 'Lake') + ' · ' + (dv >= 0 ? '+' : '−') + Math.abs(dv).toFixed(1) + ' °C vs. normal</div>'; return; }
  const v = sampleField(sst, lat, lon);
  if (v !== v) el.innerHTML = '<b>–</b><div>Outside the simulated area · ' + fmtLL(lat, lon) + '</div>';
  else if (isLand(lat, lon)) el.innerHTML = '<b>Land</b><div>' + fmtLL(lat, lon) + '</div>';
  else { const dv = sampleField(diff, lat, lon); el.innerHTML = '<b>' + v.toFixed(1) + ' °C</b><div>' + (dv >= 0 ? '+' : '−') + Math.abs(dv).toFixed(1) + ' °C vs. normal · ' + fmtLL(lat, lon) + '</div>'; }
}
function drawLegend() {
  const V = VIEWS[view], c = $('legend-canvas'), g = c.getContext('2d'), w = c.width;
  for (let x = 0; x < w; x++) { const v = V.vmin + (V.vmax - V.vmin) * x / (w - 1), li = Math.max(0, Math.min(V.lut.length - 1, Math.round((v - V.vmin) * (V.lut.length - 1) / (V.vmax - V.vmin)))), p = V.lut[li]; g.fillStyle = 'rgb(' + (p & 255) + ',' + ((p >> 8) & 255) + ',' + ((p >> 16) & 255) + ')'; g.fillRect(x, 0, 1, c.height); }
  $('ticks').innerHTML = V.ticks.map((t) => '<span class="' + (t === V.key ? 'key' : '') + '" style="left:' + ((t - V.vmin) / (V.vmax - V.vmin) * 100) + '%">' + (view === 'anom' && t > 0 ? '+' : '') + t + '</span>').join('');
  $('legend-cap').textContent = V.caption;
}

/* ------------------------------------------------------------------ *
 *  Clock + transport
 * ------------------------------------------------------------------ */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MLET = 'JFMAMJJASOND';
$('year').innerHTML = MLET.split('').map((l, i) => '<span title="' + MON[i] + '" class="' + (i >= 5 && i <= 10 ? 'hs' : '') + '">' + l + '</span>').join('');
const yearSpans = $('year').children;
function ensoLabel(v) { const a = Math.abs(v), s = a < 0.5 ? '' : a < 1 ? 'Weak ' : a < 1.5 ? 'Moderate ' : a < 2 ? 'Strong ' : 'Very strong '; return a < 0.5 ? 'Neutral' : s + (v > 0 ? 'El Niño' : 'La Niña'); }
function updateEnsoUI() {
  const v = n34, a = Math.abs(v), f = $('gauge-fill');
  const w = 50 * Math.tanh(a / 3);   // soft: the gauge keeps filling (slowly) past a strong reading instead of pinning flat once it hits a hard "3"
  f.style.width = w + '%'; f.style.left = (v >= 0 ? 50 : 50 - w) + '%'; f.style.background = v >= 0 ? '#ff9a5c' : '#6aa8ff';
  $('enso-v').textContent = (v >= 0 ? '+' : '−') + a.toFixed(1);
  $('enso-l').textContent = ensoLabel(v);
}
let lastClock = '';
function updateClock() {
  const d = simDate(simHour), hh = String(d.getUTCHours()).padStart(2, '0'), m = d.getUTCMonth(), day = d.getUTCDate(), y = d.getUTCFullYear();
  const key = simHour + '';
  if (key === lastClock) return; lastClock = key;
  $('c-date').textContent = MON[m] + ' ' + day + ', ' + y;
  $('c-time').innerHTML = hh + ':00<small>UTC</small>';
  updateEnsoUI();
  $('c-meta').textContent = 'Day ' + (Math.floor(simHour / 24) + 1);
  for (let i = 0; i < 12; i++) yearSpans[i].classList.toggle('now', i === m);
  const y0 = Date.UTC(y, 0, 1), y1 = Date.UTC(y + 1, 0, 1);
  $('year-bar').firstElementChild.style.width = ((d.getTime() - y0) / (y1 - y0) * 100).toFixed(2) + '%';
}
const STEP_MS = 60, SPEEDS = [0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32, 64];
let speedIdx = 3, playing = true, acc = 0, lastNow = 0, lastComputeHour = -99, lastComputeAt = 0, dirty = true;
function updateSpeedUI() {
  const s = SPEEDS[speedIdx];
  $('speed-x').textContent = (s < 1 ? s : s) + '×';
  $('speed-sub').textContent = s >= 1 ? '+' + s + ' h every ' + STEP_MS + ' ms' : '+1 h every ' + Math.round(STEP_MS / s) + ' ms';
  $('b-slower').disabled = speedIdx === 0; $('b-faster').disabled = speedIdx === SPEEDS.length - 1;
}
function setPlaying(p) { playing = p; $('ic-pause').style.display = p ? '' : 'none'; $('ic-play').style.display = p ? 'none' : ''; $('b-play').setAttribute('aria-label', p ? 'Pause' : 'Play'); }
function advanceHours(n) {
  const d0 = Math.floor(simHour / 24); simHour += n; const d1 = Math.floor(simHour / 24);
  for (let d = d0; d < Math.min(d1, d0 + 800); d++) stepDay();
  dirty = true;
}
function refresh(force) { computeField(); lastComputeHour = simHour; lastComputeAt = performance.now(); dirty = false; render(); }
function frame(now) {
  const dt = Math.min(250, now - lastNow); lastNow = now;
  if (playing) {
    acc += dt * SPEEDS[speedIdx]; const n = Math.floor(acc / STEP_MS);
    if (n > 0) { acc -= n * STEP_MS; advanceHours(n); updateClock(); }
  }
  if (dirty && now - lastComputeAt >= 120 && Math.abs(simHour - lastComputeHour) >= (SPEEDS[speedIdx] < 1 ? 3 : 6)) refresh();
  requestAnimationFrame(frame);
}
function restart() { initSim(P.seed); acc = 0; lastClock = ''; updateClock(); refresh(); }

$('b-play').onclick = () => setPlaying(!playing);
$('b-slower').onclick = () => { if (speedIdx > 0) { speedIdx--; updateSpeedUI(); } };
$('b-faster').onclick = () => { if (speedIdx < SPEEDS.length - 1) { speedIdx++; updateSpeedUI(); } };
$('b-restart').onclick = restart;
$('p-ensonow').oninput = () => { const t = parseFloat($('p-ensonow').value); $('p-ensonow-o').textContent = ensoLabel(t) + ' (' + (t >= 0 ? '+' : '−') + Math.abs(t).toFixed(1) + ')'; forceEnso(t); };
window.addEventListener('keydown', (e) => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === '[') $('b-slower').click(); else if (e.key === ']') $('b-faster').click();
  else if (e.key === 'r' || e.key === 'R') restart();
});

/* panel */
$('collapse').onclick = () => { const p = $('panel'); p.classList.toggle('collapsed'); $('collapse').innerHTML = p.classList.contains('collapsed') ? '&#9656;' : '&#9662;'; };
document.querySelectorAll('.subhead').forEach((h) => h.onclick = () => { const sec = h.closest('.subsec'), collapsed = sec.classList.toggle('collapsed'); h.setAttribute('aria-expanded', !collapsed); });
document.querySelectorAll('#seg-view button').forEach((b) => b.onclick = () => { view = b.dataset.v; document.querySelectorAll('#seg-view button').forEach((x) => x.setAttribute('aria-pressed', x === b)); drawLegend(); scheduleRender(); });
THEME_ORDER.forEach((id) => { const t = THEMES[id], b = document.createElement('button'); b.dataset.th = id; b.setAttribute('aria-pressed', id === 'sat'); b.innerHTML = '<i style="background:' + t.swatch + '"></i><span>' + t.name + '</span>'; b.onclick = () => setTheme(id); $('themes').appendChild(b); });
document.querySelectorAll('#seg-grid button').forEach((b) => b.onclick = () => setGridMode(b.dataset.g));
$('show-sst').onchange = scheduleRender; $('borders').onchange = scheduleRender;
$('detail').onchange = () => { syncDetail(); $('attr').textContent = TH.attr + (themeId === 'bm' && $('detail').checked ? ' · Close-ups: Esri' : ''); };
map.on('zoom', updateDetailOpacity);
$('op').oninput = () => { $('op-o').textContent = $('op').value + '%'; scheduleRender(); };
$('l265').onchange = scheduleRender; $('l2').onchange = scheduleRender;
const sliders = [['p-warm', 'warming', (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + ' °C'], ['p-var', 'variability', (v) => v.toFixed(1) + '×'], ['p-sea', 'seasonal', (v) => v.toFixed(2).replace(/0$/, '') + '×'], ['p-feat', 'features', (v) => v.toFixed(2).replace(/0$/, '') + '×'], ['p-enso', 'enso', (v) => v.toFixed(2).replace(/0$/, '') + '×']];
sliders.forEach(([id, key, fmt]) => { $(id).oninput = () => { P[key] = parseFloat($(id).value); $(id + '-o').textContent = fmt(P[key]); refresh(); }; });
/* the seed gives each run its own slightly different climate: seasonal swing, currents/upwelling and ENSO strength move by a small but noticeable amount */
function hash01(seed, k) { let t = (seed ^ Math.imul(k, 0x9E3779B1)) >>> 0; t = Math.imul(t ^ (t >>> 16), 0x85EBCA6B); t = Math.imul(t ^ (t >>> 13), 0xC2B2AE35); t ^= t >>> 16; return (t >>> 0) / 4294967296; }
function seedJitter(seed, k, lo, hi) { const mag = lo + (hi - lo) * hash01(seed, k * 2 + 1), v = 1 + (hash01(seed, k * 2 + 2) < 0.5 ? -mag : mag); return Math.round(v / 0.05) * 0.05; }
function seedSliderValues(seed) { return { 'p-sea': seedJitter(seed, 1, 0.08, 0.22), 'p-feat': seedJitter(seed, 2, 0.10, 0.30), 'p-enso': seedJitter(seed, 3, 0.12, 0.40) }; }
function setSliderValues(vals) { for (const id in vals) $(id).value = vals[id]; sliders.forEach(([id, key, fmt]) => { P[key] = parseFloat($(id).value); $(id + '-o').textContent = fmt(P[key]); }); }
$('b-reset').onclick = () => { setSliderValues(Object.assign({ 'p-warm': 0, 'p-var': 1 }, $('seed-vary').checked ? seedSliderValues(P.seed) : { 'p-sea': 1, 'p-feat': 1, 'p-enso': 1 })); refresh(); };
function applySeed(s) { s = Math.max(1, Math.min(999999, Math.floor(s) || 1)); $('seed').value = s; P.seed = s; if ($('seed-vary').checked) setSliderValues(seedSliderValues(s)); restart(); }
$('seed-vary').onchange = () => { setSliderValues($('seed-vary').checked ? seedSliderValues(P.seed) : { 'p-sea': 1, 'p-feat': 1, 'p-enso': 1 }); refresh(); };
$('seed').onchange = () => applySeed(parseFloat($('seed').value));
$('b-newseed').onclick = () => applySeed(1 + Math.floor(Math.random() * 999999));

/* ------------------------------------------------------------------ *
 *  Start
 * ------------------------------------------------------------------ */
setTheme('sat');
drawLegend(); updateSpeedUI();
if (window.innerWidth < 700) $('panel').classList.add('collapsed');
const seed0 = 1 + Math.floor(Math.random() * 999999);
$('seed').value = seed0; P.seed = seed0; setSliderValues(seedSliderValues(seed0)); initSim(seed0); updateClock();
refresh();
$('loading').style.display = 'none';
lastNow = performance.now(); requestAnimationFrame(frame);

window.SSTSIM = {
  advance(h) { advanceHours(h); updateClock(); refresh(); },
  sample(lat, lon) { return { sst: sampleField(sst, lat, lon), normal: sampleField(normal, lat, lon) }; },
  state() { return { simHour, seed: P.seed, date: simDate(simHour).toISOString(), eddies: eddies.length, gsShift }; },
  set(k, v) { P[k] = v; refresh(); }, enso() { return { n34, lag0: ensoLag(0), lag3: ensoLag(91), lag6: ensoLag(183) }; }, forceEnso, setView(v) { document.querySelector('#seg-view button[data-v="' + v + '"]').click(); },
  setPlaying, restart, map, render, setTheme, setGridMode, sliderVals() { return { seasonal: P.seasonal, features: P.features, enso: P.enso, warming: P.warming, variability: P.variability, seed: P.seed }; }, applySeed,
  bm() {
    const detail = !!(detailLayer && map.hasLayer(detailLayer));
    if (themeId === 'sat') { const st = TS.sat; return { theme: 'sat', idx: st.idx, offline: st.offline, loaded: st.loaded, label: st.offline ? 'offline (Blue Marble)' : (TILESETS.sat[st.idx] && TILESETS.sat[st.idx].label), detail, csp: cspBlocked }; }
    return { theme: themeId, embedded: true, ready: bmReady, detail, csp: cspBlocked };
  },
  lakes() { return LAKE_META.map((L, i) => ({ name: L.name, area: L.area, lat: L.lat, lon: L.lon, v: lakeV[i], n: lakeN[i] })); }, ceil: seaCeil, stats() { let mn = 99, mx = -99, nan = 0, km = 0; for (let k = 0; k < N; k++) { const v = sst[k]; if (v !== v) nan++; else { if (v < mn) mn = v; if (v > mx) { mx = v; km = k; } } } return { mn, mx, nan, at: [LAT1 - Math.floor(km / NX) * RES, LON0 + (km % NX) * RES] }; }
};
window.__ready = true;
})();
</script>
